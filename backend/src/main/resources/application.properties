spring.application.name=wedding-platform-api
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:wedding_platform}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:wedding_user}
spring.datasource.password=${DB_PASSWORD:wedding_pass_2026}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT - secret must be at least 64 chars for HS512
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTTokenGeneration2026WeddingPlatformApp!!}
app.jwt.expiration-ms=3600000
app.jwt.refresh-expiration-ms=604800000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Logging
logging.level.root=INFO
logging.level.com.weddingplatform=DEBUG

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
